name: Hotel Inventory Tracker

on:
  schedule:
    # All times are Pacific Daylight Time (PDT = UTC-7).
    # Runs that fall after midnight PT have the NEXT UTC calendar date.
    - cron: '0 14 * * *'   # 07:00 AM PT  — Morning report + scrape
    - cron: '0 16 * * *'   # 09:00 AM PT  — Scrape
    - cron: '0 22 * * *'   # 03:00 PM PT  — Scrape
    - cron: '0 1 * * *'    # 06:00 PM PT  — Scrape  (next UTC day)
    - cron: '30 4 * * *'   # 09:30 PM PT  — Scrape  (next UTC day, before Sea Air / Blufftop 10 PM cutoff)
    - cron: '59 6 * * *'   # 11:59 PM PT  — Scrape  (next UTC day, before Tarzana midnight cutoff)

  workflow_dispatch:
    inputs:
      run_type:
        description: 'Run type: scrape or report'
        required: false
        default: 'scrape'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          sudo apt-get update
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Determine run type
        id: run_type
        run: |
          # Use the cron string from github.event.schedule to detect run type.
          # Matching on the schedule value is reliable — it does not depend on
          # wall-clock time, which drifts by 2-3 minutes after job setup steps
          # and would cause the report run to silently fall through to scrape.
          SCHEDULE="${{ github.event.schedule }}"
          MANUAL_TYPE="${{ github.event.inputs.run_type }}"

          if [ "$SCHEDULE" = "0 14 * * *" ]; then
            echo "type=report" >> $GITHUB_OUTPUT
          elif [ "$MANUAL_TYPE" = "report" ]; then
            echo "type=report" >> $GITHUB_OUTPUT
          else
            echo "type=scrape" >> $GITHUB_OUTPUT
          fi

      - name: Run scraper
        if: steps.run_type.outputs.type == 'scrape'
        run: python scraper.py run
        env:
          TZ: "America/Los_Angeles"

      - name: Generate morning report
        if: steps.run_type.outputs.type == 'report'
        run: python scraper.py report
        env:
          TZ: "America/Los_Angeles"

      - name: Compute STR Aggregates and Historical Ledger
        run: python aggregate.py
        env:
          TZ: "America/Los_Angeles"

      - name: Commit and Push Changes Safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          [ -d "data" ] && git add data/*.json || true
          [ -f "data/history_ledger.json" ] && git add data/history_ledger.json || true
          [ -f "data/aggregates.json" ] && git add data/aggregates.json || true
          [ -d "reports" ] && git add reports/* || true
          [ -d "logs" ] && git add logs/* || true

          if git diff --cached --quiet; then
            echo "No operational data variations detected. Skipping empty commit."
          else
            git commit -m "chore: tracker automatic sync [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
          fi

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-reports
          path: |
            reports/
            logs/
