name: Hotel Inventory Tracker

on:
  schedule:
    # Times in UTC (Pacific = UTC-7 in PDT, UTC-8 in PST)
    # 09:00 PT  = 16:00 UTC
    - cron: '0 16 * * *'
    # 15:00 PT  = 22:00 UTC
    - cron: '0 22 * * *'
    # 18:00 PT  = 01:00 UTC next day
    - cron: '0 1 * * *'
    # 21:30 PT  = 04:30 UTC
    - cron: '30 4 * * *'
    # 23:59 PT  = 06:59 UTC
    - cron: '59 6 * * *'
    # 07:00 PT morning report = 14:00 UTC
    - cron: '0 14 * * *'

  workflow_dispatch:
    inputs:
      run_type:
        description: 'Run type: scrape or report'
        required: false
        default: 'scrape'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Skip morning report job here (handled separately below)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          sudo apt-get install -y libasound2t64 libatk-bridge2.0-0 libatk1.0-0 \
            libcups2 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0 libnspr4 \
            libnss3 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 \
            libxrandr2 xvfb

      - name: Determine run type
        id: run_type
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          # 14:00 UTC = morning report
          if [ "$HOUR" = "14" ] && [ "$MINUTE" = "00" ]; then
            echo "type=report" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.run_type }}" = "report" ]; then
            echo "type=report" >> $GITHUB_OUTPUT
          else
            echo "type=scrape" >> $GITHUB_OUTPUT
          fi

      - name: Run scraper
        if: steps.run_type.outputs.type == 'scrape'
        run: python scraper.py run

      - name: Generate morning report
        if: steps.run_type.outputs.type == 'report'
        run: python scraper.py report

      - name: Commit data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ logs/ || true
          git diff --cached --quiet || git commit -m "chore: tracker run $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || true

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ github.run_id }}
          path: |
            reports/
            logs/
          retention-days: 30
