name: Hotel Inventory Tracker

on:
  schedule:
    # Times translated to UTC (Pacific is UTC-7 in Daylight Saving Time)
    - cron: '0 16 * * *'   # 09:00 AM PT
    - cron: '0 22 * * *'   # 03:00 PM PT
    - cron: '0 1 * * *'    # 06:00 PM PT (Next Day UTC)
    - cron: '30 4 * * *'   # 09:30 PM PT (Next Day UTC)
    - cron: '59 6 * * *'   # 11:59 PM PT (Next Day UTC)
    - cron: '0 14 * * *'   # 07:00 AM PT Morning Report Run

  workflow_dispatch:
    inputs:
      run_type:
        description: 'Run type: scrape or report'
        required: false
        default: 'scrape'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
          # Synchronize system package indices to handle modernized Ubuntu 24.04 library tracks
          sudo apt-get update
          
          # Install chromium and native system binaries
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Determine run type
        id: run_type
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          if [ "$HOUR" = "14" ] && [ "$MINUTE" = "00" ]; then
            echo "type=report" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.inputs.run_type }}" = "report" ]; then
            echo "type=report" >> $GITHUB_OUTPUT
          else
            echo "type=scrape" >> $GITHUB_OUTPUT
          fi

      - name: Run scraper
        if: steps.run_type.outputs.type == 'scrape'
        run: python scraper.py run
        env:
          TZ: "America/Los_Angeles"

      - name: Generate morning report
        if: steps.run_type.outputs.type == 'report'
        run: python scraper.py report
        env:
          TZ: "America/Los_Angeles"

      - name: Compute aggregates
        run: python aggregate.py
        env:
          TZ: "America/Los_Angeles"

      - name: Commit and Push Changes Safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if directories exist before running git add to prevent pathspec exceptions
          [ -d "data" ] && git add data/*.json || true
          [ -d "reports" ] && git add reports/* || true
          [ -d "logs" ] && git add logs/* || true
          
          if git diff --cached --quiet; then
            echo "No operational data variations detected. Skipping empty commit."
          else
            git commit -m "chore: tracker automatic sync [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
          fi

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-reports
          path: |
            reports/
            logs/
