<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Intelligence Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* ── DESIGN DIRECTION: Luxury hotel operations — dark slate, warm gold, editorial typography ── */
  :root {
    --bg:        #0d0f14;
    --surface:   #141720;
    --surface2:  #1c2030;
    --border:    #262c3e;
    --gold:      #c9a84c;
    --gold-dim:  #7a6230;
    --gold-glow: rgba(201,168,76,0.12);
    --teal:      #3ecfb2;
    --rose:      #e05c6e;
    --text:      #e8e4d8;
    --muted:     #6b7280;
    --label:     #9ca3af;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-mono:    'DM Mono', 'Courier New', monospace;
    --radius:    6px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Grain overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 999; opacity: .5;
  }

  /* ── Header ── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 40px 24px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }
  header::after {
    content: '';
    position: absolute; bottom: -1px; left: 40px;
    width: 180px; height: 1px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand-title {
    font-family: var(--font-display);
    font-size: 22px; font-weight: 700;
    color: var(--text); letter-spacing: .02em;
  }
  .brand-sub {
    font-size: 10px; letter-spacing: .18em;
    text-transform: uppercase; color: var(--gold);
  }
  .header-right { display: flex; align-items: center; gap: 20px; }

  /* Date picker */
  .date-wrap { display: flex; align-items: center; gap: 8px; }
  .date-wrap label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  input[type="date"] {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: var(--font-mono); font-size: 12px;
    padding: 6px 10px; border-radius: var(--radius); cursor: pointer;
    outline: none;
  }
  input[type="date"]:focus { border-color: var(--gold-dim); }

  /* Refresh btn */
  .btn-refresh {
    background: transparent; border: 1px solid var(--gold-dim);
    color: var(--gold); font-family: var(--font-mono); font-size: 11px;
    letter-spacing: .1em; text-transform: uppercase;
    padding: 7px 16px; border-radius: var(--radius); cursor: pointer;
    transition: background .2s, border-color .2s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-refresh:hover { background: var(--gold-glow); border-color: var(--gold); }
  .btn-refresh svg { width: 12px; height: 12px; }

  /* Status pill */
  .status-pill {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 20px;
    border: 1px solid var(--border); color: var(--muted);
    display: flex; align-items: center; gap: 5px;
  }
  .status-pill .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
  }
  .status-pill.ok .dot  { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
  .status-pill.err .dot { background: var(--rose); }
  .status-pill.ok  { border-color: rgba(62,207,178,.25); color: var(--teal); }

  /* ── Main layout ── */
  main { padding: 32px 40px; display: flex; flex-direction: column; gap: 32px; }

  /* ── KPI row ── */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 16px; }
  .kpi-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px 22px;
    position: relative; overflow: hidden;
    transition: border-color .2s;
  }
  .kpi-card:hover { border-color: var(--gold-dim); }
  .kpi-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .kpi-prop {
    font-size: 9px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kpi-value {
    font-family: var(--font-display); font-size: 38px; font-weight: 900;
    color: var(--text); line-height: 1; margin-bottom: 4px;
  }
  .kpi-value.gold { color: var(--gold); }
  .kpi-value.teal { color: var(--teal); }
  .kpi-label {
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  }

  /* ── Section header ── */
  .section-header {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 16px;
  }
  .section-title {
    font-family: var(--font-display); font-size: 16px; font-weight: 700;
    color: var(--text); letter-spacing: .02em;
  }
  .section-sub { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

  /* ── Charts grid ── */
  .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .charts-grid { grid-template-columns: 1fr; } }

  .chart-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px;
    position: relative;
  }
  .chart-card-title {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 18px;
  }
  .chart-wrap { position: relative; height: 220px; width: 100%; }

  /* Chart placeholder layer */
  .chart-placeholder {
    position: absolute; inset: 0;

    display: flex; align-items: center; justify-content: center;
