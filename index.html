<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STR Dashboard</title>
<style>
  body { background: #0d0f14; color: #e8e4d8; font-family: sans-serif; padding: 1rem; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 1rem; max-width: 1200px; margin: 0 auto; }
  .card { background: #141720; border: 1px solid #262c3e; padding: 1.5rem; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { padding: 0.75rem; border-bottom: 1px solid #262c3e; text-align: left; font-size: 0.85rem; }
  .active-row { background: rgba(201,168,76,0.1); }
</style>
</head>
<body>
<div class="grid" id="app">
  <div class="card">
    <div id="propBtns"></div>
    <div id="tableContainer"></div>
  </div>
</div>
<script>
async function load() {
  const aggs = await fetch('data/aggregates.json').then(r => r.json());
  
  function update(p) {
    const weeks = aggs[p].weeks;
    const months = aggs[p].months;
    const sortedWeeks = Object.keys(weeks).sort();
    const sortedMonths = Object.keys(months).sort();
    
    let html = `<h3>${p} Historical Performance</h3><table><tr><th>Period</th><th>Occ%</th><th>ADR</th><th>RevPAR</th></tr>`;
    sortedWeeks.forEach(w => html += `<tr><td>${w}</td><td>${weeks[w].occ}%</td><td>$${weeks[w].adr}</td><td>$${weeks[w].rev}</td></tr>`);
    sortedMonths.forEach(m => html += `<tr><td>${m} (MTD)</td><td>${months[m].occ}%</td><td>$${months[m].adr}</td><td>$${months[m].rev}</td></tr>`);
    document.getElementById('tableContainer').innerHTML = html + `</table>`;
  }

  const props = Object.keys(aggs);
  props.forEach(p => {
    let btn = document.createElement('button');
    btn.innerText = p;
    btn.onclick = () => update(p);
    document.getElementById('propBtns').appendChild(btn);
  });
  update(props[0]);
}
load();
</script>
</body>
</html>
